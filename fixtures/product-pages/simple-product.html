<!doctype html>
<meta charset="utf-8">
<title>Simple product</title>
<!--
  An ordinary add control with nothing in the way. Shape quoted from
  sportstechnologylabs.com/product/bpc-157-tb-500-ghk-cu-glow-stack/ and
  swisschems.is/product/longevity-research-bundle/, the two storefronts the probe drives today.

  This is the fixture that keeps the other two honest: a detector answering "blocked"
  unconditionally passes without it.
-->
<body style="margin:0">
  <div class="product type-product product-type-simple">
    <form class="cart" action="/shop/thing/">
      <button type="submit" name="add-to-cart" value="1" class="single_add_to_cart_button button alt">Add to cart</button>
    </form>
  </div>
</body>
