# Frontend only. The Playwright worker runs on Fly — see docs/ARCHITECTURE.md.
# Until apps/web exists this config will not build; that is expected.

[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects are NOT here.
#
# `apps/web/netlifyReportProxy.ts` emits `_redirects` into the build, carrying both the `/r/*`
# proxy for captured reports and the single-page-app fallback, in that order.
#
# Two reasons, and neither is style. The report path is owned by `REPORT_LINK_PATH` in
# `packages/engine/src/reportCapture.ts` and must not be spelled a second time here — a URL shape
# stated in two places is one that will differ (D-034). And Netlify evaluates redirects in this
# file *before* `_redirects`, so a catch-all here would match `/r/*` first and serve the analyst
# app in place of every delivered report.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
